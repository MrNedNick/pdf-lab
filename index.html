<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free PDF tools in your browser: merge, split, organize pages, sign, fill forms, add text, compress. No sign-up, nothing uploaded." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>PDF Lab — free PDF tools in your browser</title>
    <script>
      // The theme is applied before the first paint, so a dark page never flashes white.
      try {
        const saved = localStorage.getItem('pdf-lab-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
